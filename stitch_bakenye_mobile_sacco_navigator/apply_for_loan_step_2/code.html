<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BND-SACCO - Loan Application</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c4c6d3",
                        "secondary-fixed": "#ffe16d",
                        "tertiary-fixed-dim": "#77dc85",
                        "on-tertiary-container": "#74d982",
                        "on-secondary-container": "#6e5c00",
                        "primary-container": "#2d4c9b",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1a1c1e",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#002108",
                        "surface-bright": "#f9f9fc",
                        "secondary-container": "#fcd400",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#544600",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dadadc",
                        "surface-container": "#eeeef0",
                        "primary": "#0e3483",
                        "on-primary-container": "#afc1ff",
                        "outline": "#747682",
                        "surface-variant": "#e2e2e5",
                        "secondary-fixed-dim": "#e9c400",
                        "surface-container-high": "#e8e8ea",
                        "background": "#f9f9fc",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f3f6",
                        "on-primary-fixed": "#00174a",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#214291",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#1a1c1e",
                        "on-secondary-fixed": "#221b00",
                        "inverse-primary": "#b3c5ff",
                        "tertiary-fixed": "#93f99e",
                        "surface-container-highest": "#e2e2e5",
                        "tertiary": "#004417",
                        "surface-tint": "#3d5aaa",
                        "on-surface-variant": "#444651",
                        "inverse-on-surface": "#f0f0f3",
                        "inverse-surface": "#2f3133",
                        "on-tertiary-fixed-variant": "#00531e",
                        "primary-fixed-dim": "#b3c5ff",
                        "surface": "#f9f9fc",
                        "secondary": "#705d00",
                        "tertiary-container": "#005e23"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-primary": "56px",
                        "unit": "4px",
                        "gutter": "16px",
                        "container-margin-desktop": "48px",
                        "touch-target-min": "44px",
                        "container-margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "button-text": ["Inter"],
                        "label-md": ["Inter"],
                        "display-currency": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "button-text": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-currency": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-lg">
<!-- Top Navigation (Suppressed for Transactional Flow, minimal header) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-center items-center px-container-margin-mobile h-touch-target-primary bg-surface border-b border-outline-variant shadow-sm">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile font-bold text-primary">Loan Application</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[56px] px-container-margin-mobile py-gutter max-w-md mx-auto w-full flex flex-col relative z-0">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="text-label-md font-label-md text-on-surface-variant">Step 2 of 7</span>
<span class="text-label-md font-label-md text-primary">Amount &amp; Purpose</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2 overflow-hidden">
<div class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 28.5%;"></div>
</div>
</div>
<!-- Loan Amount Input Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.05)] p-6 mb-gutter border border-outline-variant flex flex-col gap-unit relative">
<label class="text-body-md font-body-md text-on-surface-variant mb-1 block" for="loan-amount">Loan Amount (UGX)</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg p-3">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface-variant mr-2 select-none">UGX</span>
<input class="w-full bg-transparent border-none p-0 text-display-currency font-display-currency text-primary focus:ring-0 focus:outline-none placeholder-outline-variant text-right tracking-tight" id="loan-amount" inputmode="numeric" placeholder="0" type="text" value="500,000"/>
</div>
<p class="text-label-md font-label-md text-on-surface-variant mt-2 text-right">Max eligible: UGX 5,000,000</p>
</section>
<!-- Purpose of Loan Dropdown -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.05)] p-6 mb-8 border border-outline-variant flex flex-col gap-unit">
<label class="text-body-md font-body-md text-on-surface-variant mb-1 block" for="loan-purpose">Purpose of Loan</label>
<div class="relative">
<select class="w-full h-[56px] bg-surface-container-low border border-outline-variant rounded-lg px-4 appearance-none focus:ring-2 focus:ring-primary focus:border-primary text-body-lg font-body-lg text-on-surface cursor-pointer" id="loan-purpose">
<option disabled="" selected="" value="">Select Purpose</option>
<option value="business">Business Expansion</option>
<option value="school">School Fees</option>
<option value="emergency">Emergency / Medical</option>
<option value="agriculture">Agricultural Inputs</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</section>
<!-- Spacer to push buttons to bottom if needed -->
<div class="flex-1"></div>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full p-container-margin-mobile bg-surface shadow-[0_-4px_16px_rgba(0,0,0,0.05)] flex gap-4 md:static md:bg-transparent md:shadow-none md:p-0 md:mt-8 z-50">
<button class="flex-1 h-touch-target-primary rounded-lg border border-outline text-on-surface font-button-text text-button-text hover:bg-surface-container-low transition-colors flex items-center justify-center" type="button">
                Back
            </button>
<button class="flex-[2] h-touch-target-primary rounded-lg bg-primary text-on-primary font-button-text text-button-text hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center justify-center" type="button">
                Next Step
            </button>
</div>
</main>
<script>
        // Basic input formatting for currency
        const amountInput = document.getElementById('loan-amount');
        amountInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/,/g, '').replace(/\D/g, '');
            if (value) {
                e.target.value = parseInt(value, 10).toLocaleString('en-US');
            } else {
                e.target.value = '';
            }
        });
    </script>
</body></html>
