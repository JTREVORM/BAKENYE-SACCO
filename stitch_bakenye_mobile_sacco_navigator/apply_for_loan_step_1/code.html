<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BND-SACCO Loan Application</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#74d982",
                        "tertiary": "#004417",
                        "surface-container-low": "#f3f3f6",
                        "background": "#f9f9fc",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-container-high": "#e8e8ea",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#221b00",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-secondary-fixed-variant": "#544600",
                        "outline-variant": "#c4c6d3",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-primary": "#b3c5ff",
                        "surface-variant": "#e2e2e5",
                        "secondary-container": "#fcd400",
                        "on-primary-container": "#afc1ff",
                        "on-background": "#1a1c1e",
                        "tertiary-container": "#005e23",
                        "primary": "#0e3483",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f9f9fc",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e2e2e5",
                        "on-surface-variant": "#444651",
                        "outline": "#747682",
                        "on-tertiary-fixed": "#002108",
                        "surface-container": "#eeeef0",
                        "on-tertiary-fixed-variant": "#00531e",
                        "primary-container": "#2d4c9b",
                        "on-secondary-container": "#6e5c00",
                        "tertiary-fixed": "#93f99e",
                        "on-surface": "#1a1c1e",
                        "inverse-surface": "#2f3133",
                        "on-primary-fixed": "#00174a",
                        "surface-dim": "#dadadc",
                        "on-tertiary": "#ffffff",
                        "surface": "#f9f9fc",
                        "secondary-fixed-dim": "#e9c400",
                        "surface-tint": "#3d5aaa",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dbe1ff",
                        "secondary-fixed": "#ffe16d",
                        "tertiary-fixed-dim": "#77dc85",
                        "on-primary-fixed-variant": "#214291",
                        "secondary": "#705d00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-margin-mobile": "16px",
                        "touch-target-primary": "56px",
                        "container-margin-desktop": "48px",
                        "touch-target-min": "44px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-currency": ["Inter"],
                        "headline-lg": ["Inter"],
                        "button-text": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-currency": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "button-text": ["16px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pb-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin-mobile h-touch-target-primary bg-surface border-b border-outline-variant">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile font-bold text-primary">Loan Application</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] px-container-margin-mobile flex flex-col md:max-w-2xl md:mx-auto md:w-full">
<!-- Progress Indicator -->
<div class="mb-6">
<div class="flex justify-between items-end mb-2">
<span class="text-label-md font-label-md text-primary">Step 1 of 6</span>
<span class="text-body-md font-body-md text-on-surface-variant">Loan Type</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-300" style="width: 16.66%;"></div>
</div>
</div>
<div class="mb-8">
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-on-background mb-2">Select Loan Type</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">Choose the financial product that best fits your current needs.</p>
</div>
<!-- Selection Grid -->
<div class="grid gap-4 mb-8">
<!-- Business Loan Card -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="loan_type" type="radio" value="business"/>
<div class="bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed shadow-[0_2px_8px_rgba(0,0,0,0.05)] transition-all flex items-start gap-4 hover:shadow-lg">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center peer-checked:bg-primary peer-checked:text-on-primary text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined filled text-[24px]">storefront</span>
</div>
<div class="flex-grow">
<h3 class="text-button-text font-button-text text-on-background mb-1">Business Loan</h3>
<p class="text-body-md font-body-md text-on-surface-variant">Capital for expansion, inventory, or operational costs. Up to 5M UGX.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100">check</span>
</div>
</div>
</label>
<!-- Emergency Loan Card -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="loan_type" type="radio" value="emergency"/>
<div class="bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed shadow-[0_2px_8px_rgba(0,0,0,0.05)] transition-all flex items-start gap-4 hover:shadow-lg">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center peer-checked:bg-primary peer-checked:text-on-primary text-error transition-colors flex-shrink-0">
<span class="material-symbols-outlined filled text-[24px]">medical_services</span>
</div>
<div class="flex-grow">
<h3 class="text-button-text font-button-text text-on-background mb-1">Emergency Loan</h3>
<p class="text-body-md font-body-md text-on-surface-variant">Fast approval for medical or urgent unforeseen expenses. Up to 1M UGX.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100">check</span>
</div>
</div>
</label>
<!-- School Fees Loan Card -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="loan_type" type="radio" value="school"/>
<div class="bg-surface-container-lowest rounded-xl p-5 border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-fixed shadow-[0_2px_8px_rgba(0,0,0,0.05)] transition-all flex items-start gap-4 hover:shadow-lg">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center peer-checked:bg-primary peer-checked:text-on-primary text-secondary-container transition-colors flex-shrink-0">
<span class="material-symbols-outlined filled text-[24px]">school</span>
</div>
<div class="flex-grow">
<h3 class="text-button-text font-button-text text-on-background mb-1">School Fees Loan</h3>
<p class="text-body-md font-body-md text-on-surface-variant">Direct payment options available for partner institutions. Up to 3M UGX.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100">check</span>
</div>
</div>
</label>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant px-container-margin-mobile py-4 z-40 pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.05)]">
<div class="md:max-w-2xl md:mx-auto w-full flex justify-between gap-4">
<button class="h-touch-target-primary px-6 rounded-full border border-outline text-on-surface font-button-text text-button-text hover:bg-surface-container-low transition-colors flex-1 md:flex-none">
                Cancel
            </button>
<button class="h-touch-target-primary px-8 rounded-full bg-primary text-on-primary font-button-text text-button-text shadow-md hover:bg-primary-container transition-colors flex-1 md:flex-none flex items-center justify-center gap-2">
                Next Step
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
